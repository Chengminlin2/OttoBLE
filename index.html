<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Otto Web BLE Controller</title>
<style>
body { font-family: Arial, sans-serif; text-align:center; background:#f9f9f9; }
button{
    width:120px; height:50px; margin:10px; font-size:18px;
    border:none; border-radius:10px; background:#4CAF50; color:white;
}
button.red{ background:#d9534f; }
button.blue{ background:#0275d8;}
.container{ margin-top:30px; }
</style>
</head>
<body>

<h2>OTTO BLE 遙控器</h2>
<button id="connectBle">連線 Bluetooth</button>
<button id="disconnectBle" disabled>中斷連線</button>
<p id="status">尚未連線</p>

<div class="container">
    <button onclick="sendMove('forward')">⬆ Forward</button><br>
    <button onclick="sendMove('left')">⬅ Left</button>
    <button onclick="sendMove('stop')" class="red">⏹ Stop</button>
    <button onclick="sendMove('right')">➡ Right</button><br>
    <button onclick="sendMove('backward')">⬇ Backward</button>
</div>

<h3>Emotion 動作</h3>
<!-- 第一列 -->
<button onclick="sendGesture('happy')">Happy</button>
<button onclick="sendGesture('superhappy')">Super Happy</button>
<button onclick="sendGesture('sad')">Sad</button>
<button onclick="sendGesture('sleeping')">Sleeping</button><br>
<!-- 第二列 -->
<button onclick="sendGesture('confused')">Confused</button>
<button onclick="sendGesture('fretful')">Fretful</button>
<button onclick="sendGesture('love')">Love</button>
<button onclick="sendGesture('angry')">Angry</button><br>
<!-- 第三列 -->
<button onclick="sendGesture('magic')">Magic</button>
<button onclick="sendGesture('wave')">Wave</button>
<button onclick="sendGesture('victory')">Victory</button>
<button onclick="sendGesture('fail')">Fail</button><br>
<!-- 第四列 -->
<button onclick="sendGesture('fart')">Fart</button>

<script>
let device, server, uartService, tx;

// 速度索引 0~5，先固定 2，如果要加 slider 再改這裡
let speedIndex = 2;

const connectBtn    = document.getElementById("connectBle");
const disconnectBtn = document.getElementById("disconnectBle");
const statusEl      = document.getElementById("status");

connectBtn.onclick = async () => {
    try{
        device = await navigator.bluetooth.requestDevice({
            filters:[
                { namePrefix: "Otto" },
                { services: ["0000ffe0-0000-1000-8000-00805f9b34fb"] }
            ]
        });

        device.addEventListener("gattserverdisconnected", onDisconnected);

        server = await device.gatt.connect();
        uartService = await server.getPrimaryService("0000ffe0-0000-1000-8000-00805f9b34fb");
        tx = await uartService.getCharacteristic("0000ffe1-0000-1000-8000-00805f9b34fb");

        statusEl.innerHTML = "已連線: " + device.name;
        connectBtn.disabled = true;
        disconnectBtn.disabled = false;
    }catch(e){
        alert("連線失敗: " + e);
    }
};

disconnectBtn.onclick = () => {
    disconnect();
};

function disconnect(){
    if (device && device.gatt && device.gatt.connected){
        device.gatt.disconnect();
    } else {
        onDisconnected();
    }
}

function onDisconnected(){
    tx = null;
    uartService = null;
    server = null;
    statusEl.innerHTML = "尚未連線";
    connectBtn.disabled = false;
    disconnectBtn.disabled = true;
    console.log("藍牙已斷線");
}

function sendRaw(str){
    if(!tx) { 
        alert("請先連線 BLE"); 
        return; 
    }
    const data = new TextEncoder().encode(str);
    tx.writeValue(data);
    console.log(">>> Sent:", JSON.stringify(str));
}

// 移動 / 模式：指令 + 速度數字 + 換行
function sendMove(cmd){
    const line = cmd + String(speedIndex) + "\n";
    sendRaw(line);
}

// 表情：指令 + "0" + 換行，讓 Arduino 那邊 n 會被設成 0（合法索引）
function sendGesture(cmd){
    const line = cmd + "0\n";
    sendRaw(line);
}
</script>

</body>
</html>
