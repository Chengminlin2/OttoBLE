<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Otto Web BLE Controller</title>
<style>
body { font-family: Arial, sans-serif; text-align:center; background:#f9f9f9; }
button{
    width:120px; height:50px; margin:10px; font-size:18px;
    border:none; border-radius:10px; background:#4CAF50; color:white;
}
button.red{ background:#d9534f; }
button.blue{ background:#0275d8;}
.container{ margin-top:30px; }
</style>
</head>
<body>

<h2>OTTO BLE 遙控器</h2>
<button id="connectBle">🔗 連線 Bluetooth</button>
<p id="status">尚未連線</p>

<div class="container">
    <button onclick="sendCmd('forward')">⬆ Forward</button><br>
    <button onclick="sendCmd('left')">⬅ Left</button>
    <button onclick="sendCmd('stop')" class="red">⏹ Stop</button>
    <button onclick="sendCmd('right')">➡ Right</button><br>
    <button onclick="sendCmd('backward')">⬇ Backward</button>
</div>

<h3>Emotion 動作</h3>
<button onclick="sendCmd('happy')">😄 Happy</button>
<button onclick="sendCmd('sad')">😢 Sad</button>
<button onclick="sendCmd('victory')">🏆 Victory</button>
<button onclick="sendCmd('fart')">💨 Fart</button>

<script>
let device, server, uartService, tx;

document.getElementById("connectBle").onclick = async () => {
    try{
        device = await navigator.bluetooth.requestDevice({
            filters:[ {namePrefix:"Otto"} ],
            optionalServices:["0000ffe0-0000-1000-8000-00805f9b34fb"]   // HM-10 UART Service
        });

        server = await device.gatt.connect();
        uartService = await server.getPrimaryService("0000ffe0-0000-1000-8000-00805f9b34fb");
        tx = await uartService.getCharacteristic("0000ffe1-0000-1000-8000-00805f9b34fb");

        document.getElementById("status").innerHTML="🟢 已連線: " + device.name;
    }catch(e){
        alert("連線失敗" + e);
    }
};

function sendCmd(cmd){
    if(!tx) { alert("請先連線 BLE"); return;}
    tx.writeValue(new TextEncoder().encode(cmd+"\n"));
    console.log(">>> Sent:", cmd);
}
</script>

</body>
</html>
