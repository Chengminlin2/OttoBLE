<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Otto BLE Controller</title>
<style>
body { font-family: Arial; text-align:center; background:#f5f5f5; }
h2 { margin-top:20px; }
button {
    width:45%; padding:15px; margin:5px; font-size:20px;
    border-radius:12px;border:none;background:#4CAF50;color:white;
}
button:active { background:#2e8b57;}
#status{font-size:18px;color:#333;margin:10px;}
</style>
</head>

<body>
<h2>🤖 Otto BLE Controller</h2>
<p id="status">尚未連接</p>
<button onclick="connect()">🔗 連接 Otto</button><br>

<h3>🎮 動作控制</h3>
<button onclick="send('F')">⬆ 前進</button>
<button onclick="send('B')">⬇ 後退</button><br>
<button onclick="send('L')">⬅ 左轉</button>
<button onclick="send('R')">➡ 右轉</button><br>

<h3>🕺 特殊動作</h3>
<button onclick="send('D')">💃 跳舞</button>
<button onclick="send('W')">🤪 搖頭</button>
<button onclick="send('S')">😴 睡覺</button>

<script>
let device, server, uart;

async function connect(){
    try{
        device = await navigator.bluetooth.requestDevice({
            filters:[{ namePrefix:"HM" },{ services:["0000ffe0-0000-1000-8000-00805f9b34fb"] }]
        });

        server = await device.gatt.connect();
        uart = await server.getPrimaryService("0000ffe0-0000-1000-8000-00805f9b34fb");
        charaTX = await uart.getCharacteristic("0000ffe1-0000-1000-8000-00805f9b34fb");

        document.getElementById("status").textContent="🟢 已連接 Otto!";
    }catch(e){
        document.getElementById("status").textContent="連線失敗！";
        console.error(e);
    }
}

function send(cmd){
    if(!charaTX)return alert("尚未連線!");
    charaTX.writeValue(new TextEncoder().encode(cmd));
}
</script>
</body>
</html>
